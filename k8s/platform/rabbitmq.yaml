apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: garage-microservices
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          readinessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: garage-microservices
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
