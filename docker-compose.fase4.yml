services:
  postgres-os:
    image: postgres:16
    environment:
      POSTGRES_DB: os_service
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports: ["5432:5432"]
  postgres-billing:
    image: postgres:16
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports: ["5433:5432"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
