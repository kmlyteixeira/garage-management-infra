name: Infrastructure Apply

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        default: homologacao
        type: choice
        options: [homologacao, producao]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: aws-lab
    env:
      TF_VAR_environment: ${{ inputs.environment || vars.TERRAFORM_ENVIRONMENT || 'homologacao' }}
      TF_VAR_project_name: garage-management
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_service_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_eks_cluster_role_arn: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
      TF_VAR_eks_node_role_arn: ${{ vars.EKS_NODE_ROLE_ARN }}
      TF_VAR_enable_eks_admin_access: "true"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Configure EKS administrator
        run: |
          set -euo pipefail
          test -n "$TF_VAR_service_state_bucket"
          test -n "$TF_VAR_eks_cluster_role_arn"
          test -n "$TF_VAR_eks_node_role_arn"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          admin_role_arn="$(echo "$caller_arn" | sed -E 's#arn:aws:sts::([0-9]+):assumed-role/([^/]+)/.*#arn:aws:iam::\1:role/\2#')"
          echo "TF_VAR_admin_principal_arn=$admin_role_arn" >> "$GITHUB_ENV"
      - name: Initialize Terraform
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=infra/terraform.tfstate" -backend-config="region=${TF_VAR_region}" -backend-config="use_lockfile=true"
      - name: Remove legacy managed state bucket resources
        run: |
          terraform state list | grep -E '^aws_s3_bucket(_versioning|_server_side_encryption_configuration|_public_access_block)?\.service_state$' | while read -r address; do
            terraform state rm "$address"
          done
      - name: Import existing EKS administrator access entry
        run: |
          access_address='aws_eks_access_entry.admin[0]'
          if ! terraform state show "$access_address" >/dev/null 2>&1; then
            cluster_name="$(terraform output -raw eks_cluster_name)"
            caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
            admin_role_arn="$(echo "$caller_arn" | sed -E 's#arn:aws:sts::([0-9]+):assumed-role/([^/]+)/.*#arn:aws:iam::\1:role/\2#')"
            if aws eks describe-access-entry \
              --cluster-name "$cluster_name" \
              --principal-arn "$admin_role_arn" >/dev/null 2>&1; then
              terraform import "$access_address" "$cluster_name:$admin_role_arn"
            fi
          fi
      - run: terraform plan -out=tfplan
      - run: terraform apply tfplan
      - uses: azure/setup-kubectl@v4
      - name: Wait for EKS nodes
        run: |
          set -euo pipefail
          cluster_name="$(terraform output -raw eks_cluster_name)"
          node_group_name="$(terraform output -raw eks_node_group_name)"
          aws eks describe-nodegroup \
            --cluster-name "$cluster_name" \
            --nodegroup-name "$node_group_name" \
            --region "$TF_VAR_region" \
            --query 'nodegroup.{status:status,desired:scalingConfig.desiredSize,min:scalingConfig.minSize,max:scalingConfig.maxSize,health:health,subnets:subnets}' \
            --output yaml
          aws eks wait nodegroup-active \
            --cluster-name "$cluster_name" \
            --nodegroup-name "$node_group_name"
          aws eks update-kubeconfig --name "$cluster_name" --region "$TF_VAR_region"
          for attempt in $(seq 1 20); do
            ready_nodes="$(kubectl get nodes --no-headers 2>/dev/null | awk '$2 ~ /^Ready/ && $2 !~ /SchedulingDisabled/ { count++ } END { print count + 0 }')"
            if [ "$ready_nodes" -ge 1 ]; then
              kubectl get nodes -o wide
              exit 0
            fi
            echo "Waiting for a schedulable Ready node (attempt $attempt/20)."
            sleep 30
          done
          aws eks describe-nodegroup \
            --cluster-name "$cluster_name" \
            --nodegroup-name "$node_group_name" || true
          kubectl get nodes -o wide || true
          kubectl describe nodes || true
          exit 1
      - name: Apply platform manifests
        run: kubectl apply -k k8s/platform
